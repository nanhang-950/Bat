
<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>内网测绘报告</title>
	<style>
		:root {
			--bg: #f4f1ea;
			--paper: #fffdfa;
			--ink: #1f2933;
			--muted: #52606d;
			--line: #d9d0c3;
			--accent: #aa3a2a;
			--accent-soft: #f6dfd5;
			--accent-strong: #7c2418;
		}
		* {
			box-sizing: border-box;
		}
		body {
			margin: 0;
			font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
			background:
				radial-gradient(circle at top left, rgba(170, 58, 42, 0.12), transparent 28%),
				linear-gradient(180deg, #f7f3ec 0%, var(--bg) 100%);
			color: var(--ink);
		}
		.wrapper {
			max-width: 1180px;
			margin: 0 auto;
			padding: 40px 20px 60px;
		}
		.hero {
			background: linear-gradient(135deg, rgba(31, 41, 51, 0.96), rgba(92, 34, 26, 0.92));
			color: #fff;
			border-radius: 24px;
			padding: 36px;
			box-shadow: 0 24px 60px rgba(31, 41, 51, 0.18);
		}
		.hero h1 {
			margin: 0 0 12px;
			font-size: 38px;
			letter-spacing: 0.04em;
		}
		.hero p {
			margin: 0;
			color: rgba(255, 255, 255, 0.82);
			line-height: 1.7;
		}
		.summary {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 16px;
			margin: 24px 0 32px;
		}
		.card {
			background: var(--paper);
			border: 1px solid var(--line);
			border-radius: 18px;
			padding: 18px 20px;
			box-shadow: 0 10px 24px rgba(31, 41, 51, 0.08);
		}
		.card .label {
			color: var(--muted);
			font-size: 14px;
			margin-bottom: 8px;
		}
		.card .value {
			font-size: 30px;
			font-weight: 700;
			color: var(--accent-strong);
		}
		.section {
			margin-top: 28px;
			background: var(--paper);
			border: 1px solid var(--line);
			border-radius: 22px;
			padding: 26px;
			box-shadow: 0 14px 34px rgba(31, 41, 51, 0.06);
		}
		.section h2 {
			margin-top: 0;
			margin-bottom: 18px;
			font-size: 24px;
		}
		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
			gap: 16px;
		}
		.count-list {
			margin: 0;
			padding: 0;
			list-style: none;
		}
		.count-list li {
			display: flex;
			justify-content: space-between;
			padding: 10px 0;
			border-bottom: 1px solid rgba(217, 208, 195, 0.65);
		}
		.count-list li:last-child {
			border-bottom: 0;
		}
		.host {
			margin-top: 18px;
			padding-top: 18px;
			border-top: 1px solid rgba(217, 208, 195, 0.75);
		}
		.host:first-of-type {
			margin-top: 0;
			padding-top: 0;
			border-top: 0;
		}
		.host-meta {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			align-items: center;
			margin-bottom: 14px;
		}
		.host-meta h3 {
			margin: 0;
			font-size: 22px;
		}
		.badge {
			display: inline-flex;
			align-items: center;
			padding: 6px 12px;
			border-radius: 999px;
			background: var(--accent-soft);
			color: var(--accent-strong);
			font-size: 13px;
			font-weight: 600;
		}
		table {
			width: 100%;
			border-collapse: collapse;
			table-layout: fixed;
		}
		th, td {
			padding: 12px;
			border-bottom: 1px solid rgba(217, 208, 195, 0.85);
			text-align: left;
			word-break: break-word;
		}
		th {
			color: var(--muted);
			font-weight: 600;
		}
		.ai-box {
			padding: 20px 22px;
			border-radius: 18px;
			background: linear-gradient(180deg, rgba(246, 223, 213, 0.75), rgba(255, 253, 250, 0.96));
			border: 1px solid rgba(170, 58, 42, 0.18);
		}
		.ai-box p {
			margin: 0 0 14px;
			line-height: 1.8;
			color: var(--ink);
		}
		.ai-box p:last-child {
			margin-bottom: 0;
		}
		.empty {
			color: var(--muted);
			line-height: 1.8;
		}
		@media (max-width: 720px) {
			.hero {
				padding: 28px 22px;
			}
			.hero h1 {
				font-size: 30px;
			}
			.section {
				padding: 22px 18px;
			}
			th, td {
				padding: 10px 8px;
			}
		}
	</style>
</head>
<body>
	<div class="wrapper">
		<section class="hero">
			<h1>内网测绘报告</h1>
			<p>这份报告汇总了当前扫描任务发现的主机、开放端口与协议分布，并在末尾附上可选的 AI 风险分析结果。生成时间：2026-03-21 23:42:54</p>
		</section>

		<section class="summary">
			<div class="card">
				<div class="label">存活主机数</div>
				<div class="value">2</div>
			</div>
			<div class="card">
				<div class="label">开放端口主机</div>
				<div class="value">1</div>
			</div>
			<div class="card">
				<div class="label">开放端口数</div>
				<div class="value">1</div>
			</div>
			<div class="card">
				<div class="label">主要协议数</div>
				<div class="value">1</div>
			</div>
		</section>

		<section class="section">
			<h2>分布摘要</h2>
			<div class="grid">
				<div class="card">
					<div class="label">端口分布</div>
					<ul class="count-list">
						
						<li><span>53</span><strong>1</strong></li>
						
					</ul>
				</div>
				<div class="card">
					<div class="label">协议分布</div>
					<ul class="count-list">
						
						<li><span>DNS</span><strong>1</strong></li>
						
					</ul>
				</div>
			</div>
		</section>

		<section class="section">
			<h2>主机详情</h2>
			
			<div class="host">
				<div class="host-meta">
					<h3>10.243.120.11</h3>
					<span class="badge">系统: Linux</span>
					<span class="badge">开放端口: 1</span>
				</div>
				<table>
					<thead>
						<tr>
							<th style="width: 160px;">端口</th>
							<th>服务</th>
						</tr>
					</thead>
					<tbody>
						
						<tr>
							<td>53</td>
							<td>DNS</td>
						</tr>
						
					</tbody>
				</table>
			</div>
			
		</section>

		<section class="section">
			<h2>AI 分析</h2>
			<div class="ai-box">
				
				<p>本次未附加 AI 分析结果。你可以配置 LLM_API_KEY 后重新运行。</p>
				
			</div>
		</section>
	</div>
</body>
</html>
